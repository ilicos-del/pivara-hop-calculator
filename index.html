
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b2b">
<title>Pivara Hop Calculator</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;padding:20px;background:#f5f3eb;
 color:#193326;font-family:-apple-system,sans-serif
}

main{max-width:480px;margin:auto}

header{
 background:#173b2b;color:white;padding:25px;
 border-radius:20px;margin-bottom:20px
}

header small{letter-spacing:3px;color:#d8b66e}
h1{font-size:27px;margin:12px 0}

.card{
 background:white;border-radius:17px;
 padding:20px;margin-bottom:15px
}

.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}

label{display:block;font-weight:600;margin-bottom:8px}

.value{
 width:100%;padding:14px;
 border:2px solid #ccd5ca;border-radius:10px;
 font-size:23px;font-weight:600;
 background:white;color:#193326;min-height:58px
}

.field.active .value{border-color:#d8b66e}

.keypad{
 display:none;
 background:#f5f3eb;
 border:1px solid #e0dfd5;
 border-radius:12px;
 padding:12px;
 margin-top:10px
}

.keypad.visible{display:block}

.keys{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px
}

.key{
 border:0;border-radius:9px;
 background:white;color:#193326;
 font-size:23px;font-weight:600;
 min-height:52px
}

.key:active{background:#d8b66e}
.key.special{background:#d8b66e}
.key.clear{background:#eadfd2}

.key.done{
 grid-column:span 3;
 background:#173b2b;
 color:white;
 font-size:16px
}

.result{
 background:#173b2b;color:white;
 padding:25px;border-radius:20px;margin-top:15px
}

.result small{color:#d8b66e}

#answer{
 font-size:40px;font-weight:800;margin:12px 0
}

#difference{font-size:14px}

button.reset{
 width:100%;padding:14px;border:0;
 border-radius:10px;background:#d8b66e;
 color:#173b2b;font-size:16px;
 font-weight:bold;margin-top:15px
}

footer{
 text-align:center;color:#778078;
 font-size:12px;margin-top:25px
}
</style>
</head>

<body>
<main>

<header>
<small>PIVARA · BREWING TOOLS</small>
<h1>Hop Calculator</h1>
Preračunavanje alfa kiseline hmelja
</header>

<section class="card">

<div class="field" id="field-amount">
<label>Originalna količina hmelja (g)</label>
<div class="value" id="amount"></div>
<div class="keypad" id="keypad-amount"></div>
</div>

<div class="field" id="field-original">
<label>Alfa kiselina iz recepta (%)</label>
<div class="value" id="original"></div>
<div class="keypad" id="keypad-original"></div>
</div>

<div class="field" id="field-newAA">
<label>Alfa kiselina tvog hmelja (%)</label>
<div class="value" id="newAA"></div>
<div class="keypad" id="keypad-newAA"></div>
</div>

</section>

<section class="result">
<small>POTREBNA KOLIČINA HMELJA</small>
<div id="answer">—</div>
<div id="difference">Unesi sve tri vrijednosti.</div>
</section>

<button class="reset" onclick="resetCalc()">
Obriši sve vrijednosti
</button>

<footer>
Formula: količina × alfa recepta ÷ alfa novog hmelja
</footer>

</main>

<script>
const ids=['amount','original','newAA'];
let active=null;

function buildKeypad(id){
 const keypad=document.getElementById('keypad-'+id);

 keypad.innerHTML=`
 <div class="keys">
 <button class="key" data-key="1">1</button>
 <button class="key" data-key="2">2</button>
 <button class="key" data-key="3">3</button>
 <button class="key" data-key="4">4</button>
 <button class="key" data-key="5">5</button>
 <button class="key" data-key="6">6</button>
 <button class="key" data-key="7">7</button>
 <button class="key" data-key="8">8</button>
 <button class="key" data-key="9">9</button>
 <button class="key special" data-key=",">,</button>
 <button class="key" data-key="0">0</button>
 <button class="key clear" data-key="back">⌫</button>
 <button class="key clear" data-key="clear"
 style="grid-column:span 3">OBRIŠI POLJE</button>
 <button class="key done" data-key="done">GOTOVO</button>
 </div>`;

 keypad.addEventListener('click',e=>{
  const button=e.target.closest('button[data-key]');
  if(!button)return;
  handleKey(button.dataset.key);
 });
}

ids.forEach(id=>{
 buildKeypad(id);

 document.getElementById(id).addEventListener('click',()=>{
  selectField(id);
 });

 document.getElementById('field-'+id)
 .querySelector('label').addEventListener('click',()=>{
  selectField(id);
 });
});

function selectField(id){
 active=id;

 ids.forEach(x=>{
  document.getElementById('field-'+x)
  .classList.toggle('active',x===id);

  document.getElementById('keypad-'+x)
  .classList.toggle('visible',x===id);
 });
}

function handleKey(key){
 if(!active)return;

 const field=document.getElementById(active);
 let value=field.textContent;

 if(key==='done'){
  selectField(null);
  return;
 }

 if(key==='clear'){
  field.textContent='';
 }else if(key==='back'){
  field.textContent=value.slice(0,-1);
 }else if(key===','){
  if(value.includes(','))return;
  field.textContent=value===''?'0,':value+',';
 }else{
  if(value==='0'){
   field.textContent=key;
  }else{
   field.textContent=value+key;
  }
 }

 calc();
}

function parseValue(value){
 if(value.trim()==='' || value.endsWith(','))return NaN;
 return Number(value.replace(',','.'));
}

function calc(){
 const values=ids.map(id=>
  parseValue(document.getElementById(id).textContent)
 );

 const [a,r,h]=values;
 const out=document.getElementById('answer');
 const diff=document.getElementById('difference');

 if(
  ids.some(id=>document.getElementById(id).textContent==='')||
  values.some(v=>!Number.isFinite(v))||
  a<=0||r<=0||h<=0||r>100||h>100
 ){
  out.textContent='—';
  diff.textContent='Unesi sve tri ispravne vrijednosti.';
  return;
 }

 const n=a*r/h;
 const d=n-a;

 out.textContent=n.toLocaleString('hr-HR',{
  maximumFractionDigits:2
 })+' g';

 diff.textContent='Razlika: '+(d>0?'+':'')+
 d.toLocaleString('hr-HR',{
  maximumFractionDigits:2
 })+' g';
}

function resetCalc(){
 ids.forEach(id=>{
  document.getElementById(id).textContent='';
 });

 selectField(null);
 calc();
}

calc();
</script>

</body>
</html>
