
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b2b">
<title>Pivara Hop Calculator</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#f5f3eb;
 color:#193326;
 font-family:-apple-system,sans-serif
}

main{max-width:480px;margin:auto}

header{
 background:#173b2b;
 color:white;
 padding:25px;
 border-radius:20px;
 margin-bottom:20px
}

header small{
 letter-spacing:3px;
 color:#d8b66e
}

h1{font-size:27px;margin:12px 0}

.card{
 background:white;
 border-radius:17px;
 padding:20px;
 margin-bottom:15px
}

.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}

label{
 display:block;
 font-weight:600;
 margin-bottom:8px
}

input{
 display:block;
 width:100%;
 padding:14px;
 border:2px solid #ccd5ca;
 border-radius:10px;
 font-size:23px;
 font-weight:600;
 background:white;
 color:#193326;
 min-height:58px;
 outline:none;
 appearance:none;
 -webkit-appearance:none
}

input:focus{border-color:#d8b66e}

.result{
 background:#173b2b;
 color:white;
 padding:25px;
 border-radius:20px;
 margin-top:15px
}

.result small{color:#d8b66e}

#answer{
 font-size:40px;
 font-weight:800;
 margin:12px 0
}

#difference{font-size:14px}

button.reset{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#d8b66e;
 color:#173b2b;
 font-size:16px;
 font-weight:bold;
 margin-top:15px
}

footer{
 text-align:center;
 color:#778078;
 font-size:12px;
 margin-top:25px
}
</style>
</head>

<body>
<main>

<header>
<small>PIVARA · BREWING TOOLS</small>
<h1>Hop Calculator</h1>
Preračunavanje alfa kiseline hmelja
</header>

<section class="card">

<div class="field">
<label for="amount">Originalna količina hmelja (g)</label>
<input
 id="amount"
 type="text"
 inputmode="decimal"
 autocomplete="off"
 enterkeyhint="next"
>
</div>

<div class="field">
<label for="original">Alfa kiselina iz recepta (%)</label>
<input
 id="original"
 type="text"
 inputmode="decimal"
 autocomplete="off"
 enterkeyhint="next"
>
</div>

<div class="field">
<label for="newAA">Alfa kiselina tvog hmelja (%)</label>
<input
 id="newAA"
 type="text"
 inputmode="decimal"
 autocomplete="off"
 enterkeyhint="done"
>
</div>

</section>

<section class="result">
<small>POTREBNA KOLIČINA HMELJA</small>
<div id="answer">—</div>
<div id="difference">Unesi sve tri vrijednosti.</div>
</section>

<button class="reset" onclick="resetCalc()">
Obriši sve vrijednosti
</button>


</main>

<script>
const ids=['amount','original','newAA'];

function parseValue(value){
 const clean=value.trim().replace(/\s/g,'').replace(',','.');
 if(clean==='' || clean.endsWith('.')) return NaN;
 return Number(clean);
}

function calc(){
 const values=ids.map(id=>
  parseValue(document.getElementById(id).value)
 );

 const [a,r,h]=values;
 const out=document.getElementById('answer');
 const diff=document.getElementById('difference');

 if(
  ids.some(id=>document.getElementById(id).value.trim()==='') ||
  values.some(v=>!Number.isFinite(v)) ||
  a<=0 || r<=0 || h<=0 || r>100 || h>100
 ){
  out.textContent='—';
  diff.textContent='Unesi sve tri ispravne vrijednosti.';
  return;
 }

 const n=a*r/h;
 const d=n-a;

 out.textContent=n.toLocaleString('hr-HR',{
  maximumFractionDigits:2
 })+' g';

 diff.textContent='Razlika: '+(d>0?'+':'')+
  d.toLocaleString('hr-HR',{
   maximumFractionDigits:2
  })+' g';
}

ids.forEach((id,index)=>{
 const field=document.getElementById(id);

 field.addEventListener('input',calc);

 field.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
   e.preventDefault();

   if(index<ids.length-1){
    document.getElementById(ids[index+1]).focus();
   }else{
    field.blur();
   }
  }
 });
});

function resetCalc(){
 ids.forEach(id=>{
  document.getElementById(id).value='';
 });

 calc();
}

calc();
</script>

</body>
</html>
